<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speditions-Tablet</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="app" class="hidden">
        <div class="tablet-frame">
            <div class="tablet-screen">

                <div id="boot-screen" class="boot-screen">
                    <div class="boot-logo">SPEDITIONS-TABLET</div>
                    <div class="boot-spinner"></div>
                </div>

                <div id="denied-screen" class="denied-screen hidden">
                    <div class="denied-icon">&#9888;</div>
                    <div class="denied-title">Kein Zugriff</div>
                    <div class="denied-text" id="denied-text">Du bist kein Mitarbeiter der Spedition.</div>
                </div>

                <div id="main-ui" class="main-ui hidden">
                    <header class="topbar">
                        <div class="topbar-left">
                            <span class="brand">UM&nbsp;Spedition</span>
                            <span class="brand-sub">Speditions-Tablet</span>
                        </div>
                        <div class="topbar-right">
                            <div class="employee-chip">
                                <span id="employee-name" class="employee-name"></span>
                                <span id="employee-role" class="role-badge"></span>
                            </div>
                            <div id="clock" class="clock"></div>
                            <button id="close-btn" class="close-btn" title="Schließen">&#10005;</button>
                        </div>
                    </header>

                    <div class="body-wrap">
                        <nav id="sidebar" class="sidebar"></nav>
                        <main id="content" class="content"></main>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toast-stack" class="toast-stack"></div>
    <div id="modal-root" class="modal-root hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
