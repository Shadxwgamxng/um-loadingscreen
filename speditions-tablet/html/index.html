<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speditions-Tablet</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="app" class="hidden">
        <div class="tablet-frame">
            <div class="bezel-top"><span class="camera-dot"></span></div>
            <div class="tablet-screen">

                <div id="lock-screen" class="lock-screen">
                    <div class="lock-time" id="lock-time"></div>
                    <div class="lock-date" id="lock-date"></div>
                    <div class="lock-brand">
                        <svg class="lock-logo" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M30 72 A80 80 0 0 1 190 72" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" fill="none" />
                            <path d="M40 78 L40 128 L18 128 Z" fill="#3b82f6" />
                            <path d="M40 128 L40 78 L118 78 L118 128 Z" fill="#0e1a30" stroke="#22304f" stroke-width="2" />
                            <path d="M118 128 L118 92 L142 92 L162 112 L162 128 Z" fill="#0e1a30" stroke="#22304f" stroke-width="2" />
                            <rect x="144" y="98" width="14" height="12" rx="2" fill="#cfe0ff" />
                            <circle cx="64" cy="132" r="10" fill="#0e1a30" stroke="#22304f" stroke-width="2" />
                            <circle cx="148" cy="132" r="10" fill="#0e1a30" stroke="#22304f" stroke-width="2" />
                            <path d="M10 150 Q60 130 110 150 T210 150" stroke="#1e4faa" stroke-width="6" fill="none" stroke-linecap="round" />
                            <path d="M10 162 Q60 144 110 162 T210 162" stroke="#60a5fa" stroke-width="6" fill="none" stroke-linecap="round" />
                        </svg>
                        <div class="lock-brand-name" id="lock-company-name">Speditions-Tablet</div>
                        <div class="lock-brand-rule"><span></span>DIGITALE SPEDITIONSZENTRALE<span></span></div>
                    </div>
                    <div class="lock-hint">Zum Entsperren tippen oder eine Taste drücken</div>
                </div>

                <div id="boot-screen" class="boot-screen hidden">
                    <div class="boot-logo" id="boot-logo">SPEDITIONS-TABLET</div>
                    <div class="boot-spinner"></div>
                </div>

                <div id="login-screen" class="login-screen hidden">
                    <div class="login-box">
                        <div class="login-title">Anmeldung</div>
                        <div class="login-subtitle">Melde dich mit deinem Mitarbeiterkonto an.</div>
                        <label>Benutzername</label>
                        <input id="login-username" type="text" autocomplete="off" spellcheck="false" />
                        <label>Passwort</label>
                        <input id="login-password" type="password" autocomplete="off" />
                        <button id="login-submit" class="btn btn-primary" style="width:100%;margin-top:16px;">Anmelden</button>
                    </div>
                </div>

                <div id="main-ui" class="main-ui hidden">
                    <header class="topbar">
                        <div class="topbar-left">
                            <span class="brand" id="topbar-brand">Speditions-Tablet</span>
                            <span class="brand-sub">Speditions-Tablet</span>
                        </div>
                        <div class="topbar-right">
                            <div class="employee-chip">
                                <span id="employee-name" class="employee-name"></span>
                                <span id="employee-role" class="role-badge"></span>
                            </div>
                            <div id="clock" class="clock"></div>
                            <button id="account-btn" class="close-btn" title="Passwort ändern">&#128273;</button>
                            <button id="logout-btn" class="close-btn" title="Abmelden">&#8666;</button>
                            <button id="close-btn" class="close-btn" title="Schließen">&#10005;</button>
                        </div>
                    </header>

                    <div class="body-wrap">
                        <nav id="sidebar" class="sidebar"></nav>
                        <main id="content" class="content"></main>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toast-stack" class="toast-stack"></div>
    <div id="modal-root" class="modal-root hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
